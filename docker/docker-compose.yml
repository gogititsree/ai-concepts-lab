# Local dependencies only. The API and web app run on the host with hot reload
# (`pnpm dev`); Ollama also runs natively on the host.
#
# Postgres is not used by the app until M4 -- it is here now so the compose file and the
# volume/healthcheck plumbing are in place and reviewed once.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
