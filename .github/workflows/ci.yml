name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the two jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace libraries are consumed as built .d.ts, so the type declarations must
      # exist before the apps can be type-checked.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format:check

      # Also covers e2e/ and playwright.config.ts via tsconfig.e2e.json, which is not a
      # workspace package and so is not reached by `pnpm -r run typecheck`.
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Enforces the 90 % gate on packages/nn-core. The gate on apps/api/src/{auth,model,
      # progress} needs Postgres and lives in the integration job below.
      - run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Integration tests and coverage gate (Postgres)
    runs-on: ubuntu-latest

    # A real Postgres 16, same major version as production. The tests create and drop a
    # throwaway database per test file, so the job needs a superuser -- which the default
    # `postgres` service user is.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        # Without the healthcheck the steps start before Postgres accepts connections and
        # the first test fails with ECONNREFUSED about one run in three.
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://lab:lab@localhost:5432/lab
      NODE_ENV: test
      MODEL_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the shared contracts are needed: the api tests run from source via tsx/vitest.
      - name: Build shared contracts
        run: pnpm --filter @lab/shared run build

      # Applying the migrations as their own step means a broken migration fails with a
      # migration error rather than as a pile of confusing test failures.
      - name: Run migrations
        run: pnpm db:migrate

      # Runs the unit *and* integration suites in one pass and fails below 90 % lines on
      # src/auth, src/model and src/progress. Those directories are mostly Fastify route
      # plugins, which only the integration suite exercises, so the gate cannot live in
      # the unit job. See docs/adr/0004-e2e-and-pipeline-hardening.md.
      - name: Integration tests and coverage gate
        run: pnpm --filter api run test:coverage:gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gate
          path: apps/api/coverage-gate
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Deliberately last of the test jobs: it is the slowest and the least specific, so a
    # broken unit test should never be discovered via a browser timeout.
    needs: [unit, integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The *server* the E2E database is created on; scripts/e2e-db.mjs swaps the database
      # name for `lab_e2e`, drops it and recreates it migrated + seeded.
      DATABASE_URL: postgres://lab:lab@localhost:5432/lab
      # CLAUDE.md: never call a real model from a test. playwright.config.ts passes the
      # same value to the app under test; this one is for the provisioning scripts.
      MODEL_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser download is ~130 MB and changes only when @playwright/test does, so
      # the cache key is the resolved package version rather than the lockfile hash.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser but not the apt packages it links against, and those
      # live outside the cached directory.
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Built here rather than inside playwright's webServer so a compile error is
      # reported as a compile error instead of as "web server timed out".
      - name: Build
        run: pnpm build

      - name: Create, migrate and seed the E2E database
        run: pnpm run pretest:e2e

      - name: Run the end-to-end test
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test

      # The HTML report embeds the trace, the screenshot and the video of the retry, which
      # is the only way to debug a browser failure that did not reproduce locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    # gitleaks lists the pull request's commits to decide what to scan, which the
    # workflow-level `contents: read` does not cover. Without this the step dies on a
    # 403 "Resource not accessible by integration" that reads like a leak but is not one.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--audit-level=high` is the whole policy: low and moderate advisories are reported
      # in the log and do not fail the job, high and critical do. A solo project that
      # blocks on every moderate transitive advisory learns to ignore the job, which is
      # worse than not having it.
      - name: Audit dependencies (fails on high or critical)
        run: pnpm audit --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    # e2e included: an image is only worth publishing if the whole journey works in it.
    needs: [lint, unit, integration, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR rejects uppercase) and only adds
      # the `main` tag on the default branch.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Pull requests only prove the image builds; nothing is published from them.
          push: ${{ github.event_name != 'pull_request' }}
          # Build provenance: config.ts reads GIT_SHA and GET /api/v1/health returns it as
          # `version`, which is what deploy.yml polls for after triggering Render.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
